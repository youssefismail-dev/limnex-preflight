# Publish to PyPI with trusted publishing (OpenID Connect): no API token is stored anywhere.
# It runs only when a GitHub release is published in the PUBLIC repository youssefismail-dev/limnex-preflight, and PyPI
# accepts the upload only from the trusted publisher registered there (PyPI account settings ->
# Publishing): project limnex-preflight, this repository, workflow release.yml, environment pypi.
# Two jobs, so that the id-token permission is held only by the job that uploads, never by the one that builds.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build and check the sdist and wheel
    if: github.repository == 'youssefismail-dev/limnex-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0          # the whole history, so the next step can see main
      - name: The tagged commit must be on main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The release tag must equal the package version (pyproject.toml and __version__)
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          code_version="$(python -c 'import re; print(re.search(r"__version__ = \"([^\"]+)\"", open("limnex_preflight/__init__.py").read()).group(1))')"
          echo "tag ${TAG}, pyproject ${version}, __version__ ${code_version}"
          test "$TAG" = "v${version}"
          test "$version" = "$code_version"
      - name: Build, then install the wheel and run it once
        shell: bash
        env:
          PIP_CONSTRAINT: action-constraints.txt   # the pinned setuptools also builds the release
          TAG: ${{ github.event.release.tag_name }}
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          # build and both of its dependencies on Python 3.12 / Linux, each pinned; --no-deps lets nothing unpinned in
          python -m pip install --quiet --no-deps "build==1.6.1" "packaging==26.3" "pyproject_hooks==1.3.3"
          python -m build
          python -m venv "$RUNNER_TEMP/check"
          "$RUNNER_TEMP/check/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/check/bin/limnex-preflight" --version | tee "$RUNNER_TEMP/version.txt"
          grep -q " ${TAG#v}\$" "$RUNNER_TEMP/version.txt"     # the built wheel reports the tagged version
          "$RUNNER_TEMP/check/bin/limnex-preflight" --list-rules > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/limnex-preflight/
    permissions:
      id-token: write   # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
